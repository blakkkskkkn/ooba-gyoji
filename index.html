<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>行事管理APP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 配置：上に水色の帯（園・年度・行事・日付）、その下にアイコンつきの9つのタブ。中身は「いま何が止まっているか」を先頭に置く */
:root{
  --bg:#EEF8FC; --surface:#FFFFFF; --ink:#12333F; --muted:#51707C; --line:#D3E8F1;
  --hd:#46C6E8; --hd-ink:#06303F;
  --accent:#27AEDB; --btn:#0A7BA3; --btn-ink:#FFFFFF; --accent-text:#0B6F93; --accent-bg:#DFF3FA;
  --good:#1F8F55; --good-bg:#DDF5E7; --warn:#8F5A00; --warn-bg:#FFF1CC; --crit:#C23A2E; --crit-bg:#FFE3DF; --crit-ink:#FFFFFF;
  --track:#DDEEF5;
  --k-c:#1FA3CF; --k-o:#E8801C; --k-g:#2E9E62; --k-b:#2E7FD6; --k-p:#C2488F;
  --c1:#D64550; --c2:#5E9B3A; --c3:#D9728F; --c4:#E8912D; --c5:#7B5BB0; --c6:#2F9A5B;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --f-head:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A20; --surface:#15262E; --ink:#E3F2F7; --muted:#98B4BF; --line:#28404B;
  --hd:#14566D; --hd-ink:#E6F7FC;
  --accent:#3CC3EC; --btn:#3CC3EC; --btn-ink:#04202B; --accent-text:#7AD8F4; --accent-bg:#17414F;
  --good:#6CCB92; --good-bg:#1B3427; --warn:#E6B65A; --warn-bg:#3A2F14; --crit:#F08A80; --crit-bg:#3F1F1C; --crit-ink:#2B0B08;
  --track:#233943;
  --k-c:#5BD0F2; --k-o:#F5A04A; --k-g:#5CCB8D; --k-b:#6CAEF0; --k-p:#E57FB8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A20; --surface:#15262E; --ink:#E3F2F7; --muted:#98B4BF; --line:#28404B;
  --hd:#14566D; --hd-ink:#E6F7FC;
  --accent:#3CC3EC; --btn:#3CC3EC; --btn-ink:#04202B; --accent-text:#7AD8F4; --accent-bg:#17414F;
  --good:#6CCB92; --good-bg:#1B3427; --warn:#E6B65A; --warn-bg:#3A2F14; --crit:#F08A80; --crit-bg:#3F1F1C; --crit-ink:#2B0B08;
  --track:#233943;
  --k-c:#5BD0F2; --k-o:#F5A04A; --k-g:#5CCB8D; --k-b:#6CAEF0; --k-p:#E57FB8;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
#app{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);line-height:1.4;margin:0;text-wrap:balance}
h2{font-size:19px} h3{font-size:16px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--hd);color:var(--hd-ink);border-radius:14px}
.brand{font-family:var(--f-head);font-weight:700;font-size:20px}
.brand small{font-family:var(--f-body);font-weight:400;color:var(--hd-ink);opacity:.8;font-size:13px;margin-left:8px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ctl label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--hd-ink)}
.banner{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-block:12px 18px;scrollbar-width:thin}
.tab{flex:none;display:flex;align-items:center;gap:7px;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;padding:8px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent-text);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.sec>h2{border-bottom:1px solid var(--line);padding-bottom:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.hero{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:flex-end;justify-content:space-between}
.hero .days{font-family:var(--f-head);font-weight:700;font-size:44px;line-height:1.1}
.hero .days small{font-size:16px;margin-left:4px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--track);color:var(--muted)}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)} .chip.acc{background:var(--accent-bg);color:var(--accent-text)}
.bar{height:10px;border-radius:6px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.prog{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%;background:none;border:0;padding:0;border-radius:6px}
.prog .h{display:flex;justify-content:space-between;align-items:baseline}
.prog b{font-family:var(--f-head);font-size:17px}
.tile .v{font-family:var(--f-head);font-weight:700;font-size:22px}
.tile .l{font-size:12px;color:var(--muted)}
.tile .chip{white-space:normal;line-height:1.5;padding:3px 12px;border-radius:14px;max-width:100%}
.dots{display:inline-flex;gap:4px;margin-left:10px;vertical-align:middle}
.dots i{width:10px;height:10px;border-radius:50%;display:block}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.al{padding:8px 12px;border-radius:8px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left-width:5px}
.al.crit{border-left-color:var(--crit)} .al.warn{border-left-color:var(--warn)} .al.info{border-left-color:var(--accent)}
.al button{flex:none}
button,.btn{font:inherit;cursor:pointer}
.b{background:var(--btn);color:var(--btn-ink);border:1px solid var(--btn);border-radius:8px;padding:6px 14px;font-weight:700}
.b[disabled]{opacity:.45;cursor:not-allowed}
.b2{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 12px}
.lnk{background:none;border:0;color:var(--accent-text);padding:0;text-decoration:underline;font-size:13px}
.x{background:none;border:0;color:var(--muted);font-size:16px;padding:2px 8px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
input[type=number]{width:84px} input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--accent)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
.tw>table{min-width:600px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td input:not([type=checkbox]),td select{width:100%;min-width:90px}
td input[type=number]{min-width:64px;width:84px}
.ok{background:var(--good-bg)}
.cls{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.chk .t{flex:1;min-width:0}
.chk.done .tt{color:var(--muted);text-decoration:line-through}
.chk input[type=text]{width:100%;margin-top:4px;font-size:13px}
.gtitle{font-size:13px;color:var(--muted);font-weight:700;margin-top:8px}
.field{display:flex;flex-direction:column;gap:3px}
.field>span{font-size:12px;color:var(--muted);font-weight:700}
.sample{background:var(--warn-bg);color:var(--warn);font-size:11px;padding:0 6px;border-radius:4px;margin-left:6px;font-weight:700;white-space:nowrap}
.gantt{min-width:780px;position:relative}
.grow{display:grid;grid-template-columns:260px 1fr;align-items:center;border-bottom:1px solid var(--line);min-height:40px}
.grow.gh{min-height:0}
/* 名前は2行まで折り返す。押すと下の表のその行へ移動する */
.glabel{font:inherit;font-size:13px;line-height:1.35;color:var(--ink);text-align:left;background:none;border:0;padding:0 10px 0 0;margin:3px 0;cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.glabel:hover{color:var(--accent-text);text-decoration:underline}
.gtrack{position:relative;height:40px;cursor:pointer}
.gv{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.gv.mon{background:var(--line)} .gv.today{background:var(--crit);width:2px;z-index:2} .gv.ev{background:var(--accent);width:2px;z-index:2}
.gb{position:absolute;top:12px;height:16px;min-width:12px;border-radius:5px;background:var(--accent);z-index:1}
.gb.done{background:var(--good)} .gb.todo{background:var(--surface);border:2px solid var(--muted)} .gb.over{background:var(--crit)}
.ghead{position:relative;height:22px;font-size:11px;color:var(--muted)}
.ghead span{position:absolute;top:2px;transform:translateX(-2px)}
/* タスク表：内容を広く・折り返して全文表示。ほかの列は幅を決めて詰める */
.tw>table.ttbl{table-layout:fixed;min-width:760px}
.ttbl td{vertical-align:middle}
.ttbl textarea.ttl{display:block;width:100%;resize:none;overflow:hidden;line-height:1.5;padding:5px 8px}
.ttbl .ttl+.chip{margin-top:4px}
.ttbl td input,.ttbl td select{min-width:0}
.ttbl .cs .bi{display:flex;width:100%}
.ttbl .cs select{flex:1;font-size:13px;padding:4px 2px 4px 6px}
.ttbl .who input{font-size:13px;padding-inline:6px}
.ttbl .dt{display:grid;grid-template-columns:auto 1fr;gap:3px 6px;align-items:center}
.ttbl .dt span{font-size:11px;color:var(--muted);font-weight:700}
.ttbl .dt input{font-size:13px;padding:2px 4px;width:100%;min-width:0}
.ttbl .del{text-align:center;padding-inline:0}
.addt .field input{width:100%}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;max-width:760px}
.doc h2{margin-bottom:8px} .doc h3{margin:18px 0 6px} .doc p{margin:6px 0} .doc ul{margin:6px 0;padding-left:20px}
.doc blockquote{margin:10px 0;padding:6px 14px;border-left:4px solid var(--accent);background:var(--accent-bg)}
.doc .src{font-size:12px;color:var(--muted);margin-top:16px}
.docnav{display:flex;flex-wrap:wrap;gap:8px}
.docnav .on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.lock{border:1px dashed var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13px}
.hl{animation:hl 2.4s ease-out}
@keyframes hl{0%,30%{background:var(--warn-bg)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.hl{animation:none;background:var(--warn-bg)}}
 .empty{color:var(--muted);padding:10px 0}
.ic{display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--ic) 16%,var(--surface));color:var(--ic);vertical-align:middle}
.ic.s{width:22px;height:22px}
h2 .ic,h3 .ic{margin-right:8px;width:30px;height:30px}
.bi{display:inline-flex;align-items:center;gap:6px}
.b svg,.b2 svg,.danger svg{flex:none}
.al .ai{flex:none;margin-top:3px}
.al.crit .ai{color:var(--crit)} .al.warn .ai{color:var(--warn)} .al.info .ai{color:var(--accent-text)}
.al>span:not(.ai){flex:1;min-width:0}
.danger{background:var(--crit);color:var(--crit-ink);border:1px solid var(--crit);border-radius:8px;padding:6px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.confirm{border:2px solid var(--crit);background:var(--crit-bg);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.photos{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ph{position:relative}
.ph>button.t{border:1px solid var(--line);border-radius:8px;padding:0;background:var(--surface);display:block;overflow:hidden}
.ph img{display:block;width:64px;height:64px;object-fit:cover}
.ph .rm{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
label.bi:focus-within{outline:2px solid var(--accent);outline-offset:2px}
label.b2.bi{cursor:pointer}
#zoom{display:none}
#zoom.on{display:grid;place-items:center;position:fixed;inset:0;z-index:20;background:rgba(5,25,33,.84);padding:16px;cursor:pointer}
#zoom img{max-width:100%;max-height:82vh;border-radius:8px;background:#fff;display:block;margin:0 auto}
#zoom .zt{color:#fff;margin-top:10px;text-align:center;font-size:13px}

#sheet{display:none}
.toast{position:fixed;left:16px;right:16px;bottom:16px;z-index:9}
@media print{
  @page{size:A4 portrait;margin:11mm}
  html,body{background:#fff!important;color:#111!important}
  body{padding:0!important;font-size:10pt;line-height:1.5}
  #app,.toast,datalist,#zoom{display:none!important}
  #sheet{display:block;color:#111;background:#fff;--line:#c9d3d0;--accent:#27AEDB;--good:#1F8F55;--crit:#C23A2E;--muted:#555;--surface:#fff;--ink:#111;--track:#e4efec;--warn:#8F5A00;--warn-bg:#FFF1CC}
  #sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .s-title{font-family:var(--f-head);font-size:16pt;font-weight:700;margin:0}
  .s-sub{color:#444;font-size:9.5pt;margin-top:2px}
  .s-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
  .s-box{border:1px solid #bcc8c4;border-radius:4px;padding:5px 6px}
  .s-box b{font-size:10pt;white-space:nowrap}
  .s-bar{height:7px;background:#dcecf3;border-radius:4px;overflow:hidden;margin-top:3px}
  .s-bar i{display:block;height:100%;background:#27AEDB}
  .s-h2{font-family:var(--f-head);font-size:11pt;font-weight:700;margin:11px 0 4px;border-bottom:1.5px solid #27AEDB;padding-bottom:2px;break-after:avoid}
  .s-sec{break-inside:avoid}
  table.s-t{width:100%;border-collapse:collapse;font-size:9pt}
  .s-t th,.s-t td{border:1px solid #c9d3d0;padding:2px 5px;text-align:left;vertical-align:top;color:#111}
  .s-t th{background:#eef5f3;font-size:8.5pt;color:#333}
  .s-t thead{display:table-header-group}
  .s-t tr{break-inside:avoid}
  .s-over{color:#C23A2E;font-weight:700}
  .s-done{color:#1F8F55}
  .s-al{margin:0;padding:0;list-style:none;font-size:9.5pt}
  .s-al li{padding:1px 0 1px 12px;position:relative}
  .s-al li:before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:#27AEDB}
  .s-al li.crit:before{background:#C23A2E} .s-al li.warn:before{background:#E0A100}
  .s-foot{margin-top:10px;font-size:8.5pt;color:#555}
  #sheet .card{border:0;padding:0;background:none}
  #sheet .tw{overflow:visible}
  #sheet .gantt{min-width:0}
  #sheet .grow{grid-template-columns:150px 1fr;min-height:17px}
  #sheet .gtrack{height:17px}
  #sheet .gb{top:3px;height:11px;min-width:9px}
  #sheet .glabel{font-size:8pt;display:block;white-space:nowrap;text-overflow:ellipsis;padding:0 6px 0 0;margin:0}
  #sheet .ghead{font-size:8pt}
  #sheet p.small{font-size:8pt}
}
@media (max-width:560px){.hero .days{font-size:36px} .grow{grid-template-columns:170px 1fr}}
/* スマホ幅：タスク表を1件ずつのカードにする（内容を一番上に全幅で） */
@media (max-width:640px){
  .tw>table.ttbl{min-width:0}
  .ttbl colgroup,.ttbl thead{display:none}
  .ttbl,.ttbl tbody{display:block}
  .ttbl tr{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"ti ti" "ca who" "dts dts" "st del";gap:8px 12px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .ttbl tr:last-child{border-bottom:0}
  .ttbl td{display:block;border:0;padding:0;min-width:0}
  .ttbl .ti{grid-area:ti} .ttbl .ca{grid-area:ca} .ttbl .who{grid-area:who} .ttbl .dts{grid-area:dts} .ttbl .st{grid-area:st}
  .ttbl .del{grid-area:del;justify-self:end;align-self:end}
  .ttbl .dt input{font-size:14px;padding:4px 8px}
  .ttbl td[data-l]::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px}
}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">行事管理APP<span class="dots" aria-hidden="true"><i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c3)"></i><i style="background:var(--c4)"></i><i style="background:var(--c5)"></i><i style="background:var(--c6)"></i></span><small>v2</small></div>
    <div class="ctl" id="ctl"></div>
  </div>
  <div class="banner" id="banner"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="画面"></nav>
  <main id="view"><p class="empty">読み込んでいます…</p></main>
</div>
<div id="sheet" aria-hidden="true"></div>
<div id="zoom" data-act="closeZoom" role="dialog" aria-label="写真"></div>
<datalist id="owners"></datalist>

<script src="store.js"></script>
<script>
(function(){
"use strict";
/* v2の画面（2026-10-27）：v1.1（年度・削除・写真・アイコン・水色、10/27のタスク表・ガントチャート）をもとに、
   データの出し入れを store.js に分け、見本データ・資料の本文・職員名を外した公開用の版 */
/* ===== データの出し入れは store.js の Store だけ（v2でGoogleシート、Vercel移行時はAPIに差し替える） ===== */

/* ===== 小道具 ===== */
const CATS=["人","物","金","情報"];
const CL={"人":"だれが","物":"段取り","金":"お金","情報":"伝えること"};
const CATP=CATS.map(c=>[c,CL[c]]);
const CLASSES=[["いちご組","0歳","--c1"],["りんご組","1歳","--c2"],["さくらんぼ組","2歳","--c3"],["みかん組","3歳","--c4"],["ぶどう組","4歳","--c5"],["すいか組","5歳","--c6"]];
const OWNERS=["園長","各クラス","係"];  /* 「誰が」の候補は役割だけ。職員の呼び名は Store.owners()（v2でシートの「設定」）から */
let STAFF=[];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const D=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diff=(a,b)=>Math.round((D(b)-D(a))/864e5);

const evFY=e=>fyOf(e.date||asOf());

/* ===== 計算 ===== */
function stat(e){const o={};CATS.forEach(c=>{const ts=e.tasks.filter(t=>t.cat===c),cs=e.checks.filter(k=>k.cat===c);const total=ts.length+cs.length;const done=ts.filter(t=>t.status==="完了").length+cs.filter(k=>k.done).length;o[c]={total,done,pct:total?Math.round(done/total*100):0}});return o}
const chkCount=(e,c)=>{const cs=e.checks.filter(k=>k.cat===c);return cs.filter(k=>k.done).length+" / "+cs.length};
function judge(e){const att=Object.keys(e.staff).reduce((a,k)=>a+(+e.staff[k]||0),0);const need=e.places.reduce((a,p)=>a+(+p.need||0),0);const left=att-2-need;return {att,need,left,state:left<0?"short":left===0?"tight":"ok"}}
function overdue(e){return e.tasks.filter(t=>t.status!=="完了"&&t.due&&diff(t.due,asOf())>0)}
function soon(e){return e.tasks.filter(t=>t.status!=="完了"&&t.due&&diff(asOf(),t.due)>=0&&diff(asOf(),t.due)<=7)}
function orderTotal(e){return e.orders.reduce((a,o)=>a+(+o.amount||0),0)}
function otTotal(e){return e.overtime.reduce((a,o)=>a+(+o.hours||0),0)}
function alerts(e){
  const a=[];
  if(isArchive(e)){
    if(isExpired(e))a.push({lv:"warn",text:"保管期間を過ぎています（"+ymLabel(keepUntil(evFY(e)))+"まで）。消すかどうかは園長が判断します。自動では消えません。",go:"list"});
    a.push({lv:"info",text:evFY(e)+"年度の行事です（アーカイブ）。保管は"+ymLabel(keepUntil(evFY(e)))+"までです。",go:"list"});
    return a;
  }
  overdue(e).forEach(t=>a.push({lv:"crit",text:"期限が過ぎています：「"+t.title+"」（"+fmt(t.due)+"・"+t.owner+"）",go:"tasks"}));
  soon(e).forEach(t=>a.push({lv:"warn",text:"7日以内：「"+t.title+"」（"+fmt(t.due)+"・"+t.owner+"）",go:"tasks"}));
  const j=judge(e);
  if(j.state==="short")a.push({lv:"crit",text:"2人欠けると人員が足りません（あと"+(-j.left)+"人）",go:"people"});
  if(j.state==="tight")a.push({lv:"warn",text:"2人欠けると、配置の余りがありません",go:"people"});
  if(!e.commander)a.push({lv:"warn",text:"司令塔（全体を見て連絡を受ける人）が決まっていません",go:"people"});
  if(e.photographer==="unset")a.push({lv:"warn",text:"カメラマンが来るかどうかが未確認です",go:"people"});
  if(e.budget>0&&orderTotal(e)>e.budget)a.push({lv:"crit",text:"発注の合計が予算を超えています",go:"money"});
  const st=diff(e.updatedAt,asOf());
  if(st>7)a.push({lv:"warn",text:"最終更新から"+st+"日たっています。止まっていませんか？",go:"dash"});
  if(e.prevTaskCount&&e.tasks.length>Math.ceil(e.prevTaskCount*1.2))a.push({lv:"warn",text:"タスクが前回（"+e.prevTaskCount+"件）より多くなっています（"+e.tasks.length+"件）。やりたいことが増えすぎていませんか？",go:"tasks"});
  const d=diff(asOf(),e.date||asOf());
  if(e.date&&d<0)a.push({lv:"info",text:"本番は終了しました。振り返りを記録しましょう",go:"log"});
  return a;
}

function checksBlock(e,cat){
  const items=e.checks.map((k,i)=>({k,i})).filter(x=>x.k.cat===cat);
  let h='<div class="gtitle">毎回の確認（行事のチェックリスト）</div>';
  if(!items.length)h+='<p class="empty">この分類の確認項目はありません。</p>';
  items.forEach(x=>{h+='<div class="chk'+(x.k.done?" done":"")+'" id="chk_'+x.k.id+'"><input type="checkbox" data-p="checks.'+x.i+'.done"'+(x.k.done?" checked":"")+'><div class="t"><div class="tt">'+esc(x.k.text)+" "+refLink(x.k.ref)+'</div><input type="text" data-p="checks.'+x.i+'.note" value="'+esc(x.k.note)+'" placeholder="メモ（いつ・誰に・どう決めたか）"></div>'+(x.k.custom?'<button class="x" data-act="del" data-k="checks" data-i="'+x.i+'" aria-label="この確認項目を削除">'+svg("trash",16)+'</button>':"")+'</div>'});
  /* 行事ごとに任意で足す。足した項目だけ消せる */
  h+='<div class="row" style="margin-top:10px;align-items:flex-end"><label class="field" style="flex:1 1 260px"><span>確認項目を追加</span>'+DR("chk."+cat,{ph:"この行事で確認したいこと"})+'</label><button class="b2" data-act="addCheck" data-i="'+cat+'">追加する</button></div>';
  return h;

function ganttHTML(e,rows){const a=asOf();let h="";
  const ds=rows.filter(x=>x.t.due);
  if(ds.length){
    const mn=ds.reduce((m,x)=>{const s=x.t.start||x.t.due;return s<m?s:m},ds[0].t.start||ds[0].t.due);
    const mx=ds.reduce((m,x)=>x.t.due>m?x.t.due:m,ds[0].t.due);
    const span=diff(mn,mx)+1;const pos=s=>diff(mn,s)/span*100;
    const lines=[];for(let k=0;k<span;k++){const d=addDays(D(mn),k);if(d.getDay()===1)lines.push({k,lab:(d.getMonth()+1)+"/"+d.getDate()})}
    const vl=lines.map(l=>'<i class="gv mon" style="left:'+(l.k/span*100)+'%"></i>').join("")+(diff(mn,a)>=0&&diff(a,mx)>=0?'<i class="gv today" style="left:'+pos(a)+'%"></i>':"")+(e.date&&diff(mn,e.date)>=0&&diff(e.date,mx)>=0?'<i class="gv ev" style="left:'+pos(e.date)+'%"></i>':"");
    h+='<div class="tw card"><div class="gantt"><div class="grow gh"><div></div><div class="ghead">'+lines.map(l=>'<span style="left:'+(l.k/span*100)+'%">'+l.lab+'</span>').join("")+'</div></div>'+
      ds.map(x=>{const t=x.t,s=t.start||t.due;const w=Math.max(1.4,(diff(s,t.due)+1)/span*100);const cls=t.status==="完了"?"done":diff(t.due,a)>0?"over":t.status==="進行中"?"":"todo";
        return '<div class="grow"><button type="button" class="glabel" data-act="jump" data-i="'+x.i+'" data-gl="'+x.i+'" title="'+esc(t.title)+'">'+esc(t.title)+'</button><div class="gtrack" data-act="jump" data-i="'+x.i+'" title="'+esc(t.title)+'（'+short(s)+'〜'+short(t.due)+'）">'+vl+'<i class="gb '+cls+'" style="left:'+pos(s)+'%;width:'+w+'%"></i></div></div>'}).join("")+
      '</div><p class="small muted" style="margin:8px 0 0">赤い縦線＝この日（'+fmt(a)+'）／青緑の縦線＝本番。緑＝完了、青緑＝進行中、枠だけ＝未着手、赤＝期限切れ。名前やバーを押すと、下の表のその行へ移動します。</p></div>';
  }
  return h}

let SAVE={k:"",m:"",at:""},lastProblem="";
const PROBLEM=["conflict","net","pass","big"];
function paintBanner(){
  if(Store.mode==="local"){$c("banner").innerHTML=S.ui.confirmReset?'<span><b>このブラウザに入力したものを全部消します。</b>行事・伝達ログ・写真もすべて消えます。元に戻せません。</span><span class="row"><button class="danger" data-act="doReset">全部消す</button><button class="b2" data-act="noReset">やめる</button></span>':'<span><b>v2（準備中）。</b>入力はこのブラウザにだけ保存されます（Googleシートにつなぐまでの仮の保存です）。</span><button class="b2" data-act="askReset">全部消す</button>';return}
  const k=SAVE.k,bad=PROBLEM.indexOf(k)>=0;
  const msg=bad?'<span style="color:var(--crit)"><b>'+esc(SAVE.m)+'</b></span>':'<span>'+(k==="saving"?"Googleシートに保存しています…":k==="saved"?"Googleシートに保存しました（"+SAVE.at+"）":"入力はGoogleシートに保存されます。")+'</span>';

  $c("banner").innerHTML=msg+'<span class="row">'+btn+'<button class="b2" data-act="forget">この端末の合言葉を消す</button></span>';
}

function derived(){
  const e=ev();
  const jd=$c("judge");
  if(jd){const j=judge(e);const m={ok:["good","○ 2人欠けても回る"],tight:["warn","ぎりぎり"],short:["crit","× 足りない"]}[j.state];
    jd.innerHTML='<b>判定</b><span class="chip '+m[0]+'" style="align-self:flex-start;font-size:15px">'+m[1]+'</span><div class="num">出勤予定 '+j.att+'人 − 2人 = '+(j.att-2)+'人<br>必要な配置 '+j.need+'人<br>'+(j.left>=0?"余り "+j.left+"人":"不足 "+(-j.left)+"人")+'</div>'}
  const ot=$c("ototals");if(ot){const t=orderTotal(e);ot.innerHTML='<span class="num">合計 <b>'+yen(t)+'</b>　'+(e.budget>0?(t>e.budget?'<span class="chip crit">予算を超過</span>':'<span class="chip good">予算内（残り '+yen(e.budget-t)+'）</span>'):"")+'</span>'}
  const ott=$c("ottotals");if(ott){const t=otTotal(e);ott.innerHTML='<span class="num">合計 <b>'+t+'時間</b>　'+(e.rate>0?'概算 <b>'+yen(t*e.rate)+'</b>':'<span class="chip">単価は保留</span>')+'</span>'}
  const gc=$c("gcount");if(gc){const n=e.kids.filter(k=>String(k.growth).trim()).length;gc.innerHTML='<span class="chip '+(n===e.kids.length?"good":"warn")+'">'+n+' / '+e.kids.length+' クラス記入済み</span>'}
  const rb=$c("rbtn");if(rb){const r=S.ui.draft.retro;rb.disabled=!(String(r.fact).trim()&&String(r.who).trim()&&r.weeks!==""&&String(r.what).trim()&&Number(r.weeks)>=0)}
  const ow=$c("onewarn");if(ow){const l=S.ui.draft.log.one;ow.innerHTML=l.length>40?'<span class="chip warn">長くなっています。「要するに？」を一文にしましょう（'+l.length+'字）</span>':""}
  const mk=$c("mk");if(mk)mk.disabled=!S.ui.draft.ev.date;
  const fh=$c("fyhint");if(fh)fh.textContent=S.ui.draft.ev.date?fyOf(S.ui.draft.ev.date)+"年度の行事になります":"";
  const pu=$c("phuse");if(pu){const n=S.events.reduce((a,x)=>a+photoCount(x),0);pu.textContent=Store.mode!=="local"?"写真 全部で"+n+"枚（Googleドライブに保存します）":"写真 全部で"+n+"枚・約"+(photoChars()/1e6).toFixed(1)+"MB（このブラウザに入る目安は約"+(PHOTO_LIMIT/1e6).toFixed(1)+"MB。v2ではGoogleドライブに移します）"}
  buildSheet();
}

document.addEventListener("change",function(x){
  const t=x.target;

    if(u.indexOf("draft.")===0){setP(S.ui,u,t.value);derived();return}

    if(u==="fy"){S.ui.confirmDel="";setFY(Number(t.value));render();window.scrollTo(0,0);return}
    S.ui[u]=t.value;if(u==="asOf"){if(!t.value)S.ui.asOf=todayISO();setFY(curFY())}render(true);return;
  }
  if(p){
    let v;
    if(t.type==="checkbox")v=t.checked;
    else if(t.type==="radio"){if(!t.checked)return;v=t.value}
    else if(t.type==="number")v=t.value===""?0:Number(t.value);
    else v=t.value;
    if(t.classList.contains("ttl")){v=v.replace(/\s*\n\s*/g," ");const gl=document.querySelector('[data-gl="'+p.split(".")[1]+'"]');if(gl){gl.textContent=v;gl.title=v}}
    setP(ev(),p,v);touch();
    if(t.type==="checkbox"||t.type==="radio"||t.tagName==="SELECT"||t.type==="date")render(true);else derived();
  }
});
document.addEventListener("click",function(x){
  const b=x.target.closest("[data-act]");if(!b||b.tagName==="INPUT")return;

  if(a==="reload"){location.reload();return}
  if(a==="forget"){Store.forget();location.reload();return}
  if(a==="jump"){const r=$c("tr_"+i);if(r){r.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});r.classList.remove("hl");void r.offsetWidth;r.classList.add("hl")}return}
  if(a==="open"){S.currentId=i;S.ui.tab="dash";persist();render();window.scrollTo(0,0);return}
  if(a==="today"){S.ui.asOf=todayISO();setFY(curFY());render(true);return}
  if(a==="askDel"){if(S.events.length<=1){alert_("行事が1件だけのときは削除できません。新しい行事を作ってから消してください。");return}S.ui.confirmDel=i;render(true);return}
  if(a==="noDel"){S.ui.confirmDel="";render(true);return}
  if(a==="doDel"){const k=S.events.findIndex(z=>z.id===i);if(k<0||S.events.length<=1)return;const nm=S.events[k].name;S.events.splice(k,1);S.ui.confirmDel="";
    if(!fyEvents(S.ui.fy).length&&S.ui.fy!==curFY())S.ui.fy=evFY(S.events[0]);
    const fl=fyEvents(S.ui.fy);if(!S.events.some(z=>z.id===S.currentId))S.currentId=(fl[0]||S.events[0]).id;
    persist();render(true);toast("「"+nm+"」を削除しました");return}
  if(a==="askReset"){S.ui.confirmReset=true;render(true);return}
  if(a==="noReset"){S.ui.confirmReset=false;render(true);return}
  if(a==="doReset"){if(Store.mode!=="local")return;Store.clear();S.events=[];S.currentId="";S.ui.tab="list";S.ui.asOf=todayISO();S.ui.confirmReset=false;S.ui.confirmDel="";S.ui.draft.log=blankLog();setFY(curFY(),true);render();return}
  if(a==="zoom"){S.ui.zoom={i:i,j:Number(b.getAttribute("data-j"))};render(true);return}
  if(a==="closeZoom"){S.ui.zoom=null;render(true);return}
  if(a==="rmPhoto"){const j=Number(b.getAttribute("data-j"));if(i==="d")dr.log.photos.splice(j,1);else{const l=e.logs[Number(i)];if(l&&l.photos)l.photos.splice(j,1);touch()}render(true);return}
  if(a==="print"){doPrint();return}
  if(a==="doc"){S.ui.tab="docs";S.ui.doc=b.getAttribute("data-d");render();const id=b.getAttribute("data-i");const el=id&&id!=="top"?document.getElementById(id):null;if(el){el.scrollIntoView({behavior:"auto",block:"start"});el.classList.add("hl")}else window.scrollTo(0,0);return}
  if(a==="del"){const k=b.getAttribute("data-k");e[k].splice(Number(i),1);touch();render(true);return}
  if(a==="addTeam"){e.team.push({name:"",role:""})}
  else if(a==="addCare"){e.care.push({cls:CLASSES[0][0],initial:"",plan:"",person:""})}
  else if(a==="addOrder"){e.orders.push({name:"",to:"",due:"",amount:0,state:"未発注"})}
  else if(a==="addOT"){e.overtime.push({label:"",hours:0})}
  else if(a==="addNotice"){e.notices.push({what:"",when:"",drafter:"",one:"",ok:false})}
  else if(a==="addCheck"){const tx=String(dr.chk[i]||"").trim();if(!tx){alert_("確認項目を入れてください");return}e.checks.push({id:uid(),cat:i,group:"every",text:tx,done:false,note:"",ref:"",custom:true});dr.chk[i]=""}
  else if(a==="addPlace"){const n=String(dr.place||"").trim();if(!n){alert_("配置の名前を入れてください");return}e.places.push({name:n,need:0,custom:true});dr.place=""}
  else if(a==="addTask"){const t=dr.task;if(!String(t.title).trim()||!t.due){alert_("内容と期限を入れてください");return}e.tasks.push({id:uid(),cat:t.cat,title:t.title.trim(),owner:t.owner,start:t.start||t.due,due:t.due,status:"未着手"});dr.task={cat:"物",title:"",owner:"",start:"",due:""}}
  else if(a==="addLog"){const l=dr.log;if(!l.when||!String(l.one).trim()){alert_("いつ・言いたい一言を入れてください");return}e.logs.push({when:l.when,where:l.where,from:l.from,to:l.to,one:l.one.trim(),ref:l.ref,ok:false,photos:(l.photos||[]).slice()});if(!touch()){e.logs.pop();render(true);return}dr.log=blankLog();render(true);return}
  else if(a==="addRetro"){const r=dr.retro;e.retros.push({cat:r.cat,fact:r.fact.trim(),did:r.did.trim(),who:r.who.trim(),weeks:Number(r.weeks),what:r.what.trim()});dr.retro={cat:"人",fact:"",did:"",who:"",weeks:"",what:""}}
  else if(a==="mk"){
    const src=(e&&(e.retros||[]).length?e:null)||S.events.find(z=>(z.retros||[]).length);
    const n=newEvent(dr.ev.name.trim()||"新しい行事",dr.ev.date);
    ((src&&src.retros)||[]).forEach(r=>{if(r.who&&r.weeks!==""&&r.what){const due=iso(addDays(D(dr.ev.date),-7*Number(r.weeks)));n.tasks.push({id:uid(),cat:r.cat,title:r.what,owner:r.who,start:due,due,status:"未着手",fromRetro:true})}});
    S.events.push(n);S.currentId=n.id;S.ui.fy=evFY(n);S.ui.tab="tasks";dr.ev={name:"冬の行事",date:""};persist();render();window.scrollTo(0,0);return}
  else return;
  touch();render(true);
});
function shrink(f){return new Promise(function(res){
  const fr=new FileReader();fr.onerror=function(){res(null)};
  fr.onload=function(){const im=new Image();im.onerror=function(){res(null)};
    im.onload=function(){try{const M=1200,r=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight));const w=Math.max(1,Math.round(im.naturalWidth*r)),h=Math.max(1,Math.round(im.naturalHeight*r));const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",0.6))}catch(z){res(null)}};
    im.src=fr.result};
  fr.readAsDataURL(f)})}
function addPhotos(inp){
  const tgt=inp.getAttribute("data-photo"),files=Array.from(inp.files||[]);inp.value="";
  if(!files.length)return;
  const e=ev();
  const arrOf=function(){if(tgt==="draft")return S.ui.draft.log.photos;const l=e.logs[Number(tgt.slice(4))];if(!l)return null;if(!l.photos)l.photos=[];return l.photos};
  let chain=Promise.resolve();
  files.forEach(function(f){chain=chain.then(function(){return shrink(f)}).then(function(url){
    const arr=arrOf();if(!arr)return;
    if(arr.length>=PHOTO_MAX){alert_("写真は1件につき"+PHOTO_MAX+"枚までです");return}
    if(!url){alert_("写真を読み込めませんでした");return}
    if(Store.mode==="local"&&photoChars()+url.length>PHOTO_LIMIT){alert_("保存できる容量がいっぱいです。使っていない写真を消してください");return}
    arr.push(url);
    if(tgt!=="draft"&&!touch())arr.pop()})});
  chain.then(function(){render(true)})}
document.addEventListener("keydown",function(k){if(k.key==="Escape"&&S.ui.zoom){S.ui.zoom=null;render(true)}});
/* 内容欄のEnterは改行せず確定（日本語の変換中のEnterはそのまま） */
document.addEventListener("keydown",function(k){if(k.key==="Enter"&&!k.isComposing&&k.keyCode!==229&&k.target.classList&&k.target.classList.contains("ttl")){k.preventDefault();k.target.blur()}});
function toast(msg,bad){const el=document.createElement("div");el.className="toast";el.style.cssText="border-radius:8px;padding:10px 14px;font-size:13px;border:1px solid "+(bad?"var(--crit)":"var(--accent-text)")+";background:"+(bad?"var(--crit-bg)":"var(--accent-bg)")+";color:"+(bad?"var(--crit)":"var(--accent-text)");el.textContent=msg;document.body.appendChild(el);setTimeout(function(){el.remove()},5000)}
function alert_(m){toast(m,true)}

/* ===== 起動：データ・資料・呼び名を store.js から読む ===== */
function boot(){
Promise.all([Store.load(),Store.docs(),Store.owners()]).then(function(r){
  const l=r[0];
  S.events=l&&Array.isArray(l.events)?l.events:[];
  S.currentId=(l&&l.currentId)||(S.events[0]||{}).id||"";
  if(!S.events.some(e=>e.id===S.currentId))S.currentId=(S.events[0]||{}).id||"";
  DOCSRC=r[1]||null;
  STAFF=Array.isArray(r[2])?r[2]:[];
  if(!S.events.length)S.ui.tab="list";
  setFY(curFY(),true);
  render();
}).catch(function(err){
  if(err&&err.need==="pass"){passView(err.why);return}
  $c("view").innerHTML='<p class="empty">データを読み込めませんでした。時間をおいて開き直してください。</p>'});
}
/* 合言葉を入れる画面（シート保存のときだけ出る）。合言葉はこの端末に覚えておく */
function passView(why){
  $c("view").innerHTML='<div class="sec"><h2>'+IC("list")+'合言葉を入れてください</h2><form id="passf" class="card stack"><p>合言葉を入れると、行事のデータが開きます。</p>'+(why?'<p style="color:var(--crit)"><b>'+esc(why)+'</b></p>':"")+'<label>合言葉 <input type="password" id="passin" autocomplete="current-password" required></label><div><button class="b" type="submit">開く</button></div><p class="small muted">この端末に覚えておきます。共用の端末では、使い終わったら画面上部の「この端末の合言葉を消す」を押してください。</p></form></div>';
  const f=$c("passin");if(f)f.focus();
}
document.addEventListener("submit",function(x){if(x.target.id!=="passf")return;x.preventDefault();Store.setPass($c("passin").value);$c("view").innerHTML='<p class="empty">開いています…</p>';boot()});
boot();
})();
