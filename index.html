<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>行事管理APP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 配置：上に水色の帯（園・年度・行事・日付）、その下にアイコンつきの9つのタブ。中身は「いま何が止まっているか」を先頭に置く */
:root{
  --bg:#EEF8FC; --surface:#FFFFFF; --ink:#12333F; --muted:#51707C; --line:#D3E8F1;
  --hd:#46C6E8; --hd-ink:#06303F;
  --accent:#27AEDB; --btn:#0A7BA3; --btn-ink:#FFFFFF; --accent-text:#0B6F93; --accent-bg:#DFF3FA;
  --good:#1F8F55; --good-bg:#DDF5E7; --warn:#8F5A00; --warn-bg:#FFF1CC; --crit:#C23A2E; --crit-bg:#FFE3DF; --crit-ink:#FFFFFF;
  --track:#DDEEF5;
  --k-c:#1FA3CF; --k-o:#E8801C; --k-g:#2E9E62; --k-b:#2E7FD6; --k-p:#C2488F;
  --c1:#D64550; --c2:#5E9B3A; --c3:#D9728F; --c4:#E8912D; --c5:#7B5BB0; --c6:#2F9A5B;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --f-head:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A20; --surface:#15262E; --ink:#E3F2F7; --muted:#98B4BF; --line:#28404B;
  --hd:#14566D; --hd-ink:#E6F7FC;
  --accent:#3CC3EC; --btn:#3CC3EC; --btn-ink:#04202B; --accent-text:#7AD8F4; --accent-bg:#17414F;
  --good:#6CCB92; --good-bg:#1B3427; --warn:#E6B65A; --warn-bg:#3A2F14; --crit:#F08A80; --crit-bg:#3F1F1C; --crit-ink:#2B0B08;
  --track:#233943;
  --k-c:#5BD0F2; --k-o:#F5A04A; --k-g:#5CCB8D; --k-b:#6CAEF0; --k-p:#E57FB8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A20; --surface:#15262E; --ink:#E3F2F7; --muted:#98B4BF; --line:#28404B;
  --hd:#14566D; --hd-ink:#E6F7FC;
  --accent:#3CC3EC; --btn:#3CC3EC; --btn-ink:#04202B; --accent-text:#7AD8F4; --accent-bg:#17414F;
  --good:#6CCB92; --good-bg:#1B3427; --warn:#E6B65A; --warn-bg:#3A2F14; --crit:#F08A80; --crit-bg:#3F1F1C; --crit-ink:#2B0B08;
  --track:#233943;
  --k-c:#5BD0F2; --k-o:#F5A04A; --k-g:#5CCB8D; --k-b:#6CAEF0; --k-p:#E57FB8;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
#app{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);line-height:1.4;margin:0;text-wrap:balance}
h2{font-size:19px} h3{font-size:16px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--hd);color:var(--hd-ink);border-radius:14px}
.brand{font-family:var(--f-head);font-weight:700;font-size:20px}
.brand small{font-family:var(--f-body);font-weight:400;color:var(--hd-ink);opacity:.8;font-size:13px;margin-left:8px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ctl label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--hd-ink)}
.banner{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-block:12px 18px;scrollbar-width:thin}
@media (min-width:700px){.tabs{flex-wrap:wrap;overflow-x:visible}}
.tab{flex:none;display:flex;align-items:center;gap:7px;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;padding:8px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent-text);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.sec>h2{border-bottom:1px solid var(--line);padding-bottom:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.frow{align-items:flex-start}
.frow>.b{align-self:flex-end;height:40px}
.stack{display:flex;flex-direction:column;gap:10px}
.hero{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:flex-end;justify-content:space-between}
.hero .days{font-family:var(--f-head);font-weight:700;font-size:44px;line-height:1.1}
.hero .days small{font-size:16px;margin-left:4px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--track);color:var(--muted)}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)} .chip.acc{background:var(--accent-bg);color:var(--accent-text)}
.bar{height:10px;border-radius:6px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.prog{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%;background:none;border:0;padding:0;border-radius:6px}
.prog .h{display:flex;justify-content:space-between;align-items:baseline}
.prog b{font-family:var(--f-head);font-size:17px}
.tile .v{font-family:var(--f-head);font-weight:700;font-size:22px}
.tile .l{font-size:12px;color:var(--muted)}
.tile .chip{white-space:normal;line-height:1.5;padding:3px 12px;border-radius:14px;max-width:100%}
.dots{display:inline-flex;gap:4px;margin-left:10px;vertical-align:middle}
.dots i{width:10px;height:10px;border-radius:50%;display:block}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.al{padding:8px 12px;border-radius:8px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left-width:5px}
.al.crit{border-left-color:var(--crit)} .al.warn{border-left-color:var(--warn)} .al.info{border-left-color:var(--accent)}
.al button{flex:none}
button,.btn{font:inherit;cursor:pointer}
.b{background:var(--btn);color:var(--btn-ink);border:1px solid var(--btn);border-radius:8px;padding:6px 14px;font-weight:700}
.b[disabled]{opacity:.45;cursor:not-allowed}
.b2{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 12px}
.lnk{background:none;border:0;color:var(--accent-text);padding:0;text-decoration:underline;font-size:13px}
.x{background:none;border:0;color:var(--muted);font-size:16px;padding:2px 8px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
input[type=number]{width:84px} input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--accent)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
.tw>table{min-width:600px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td input:not([type=checkbox]),td select{width:100%;min-width:90px}
td input[type=number]{min-width:64px;width:84px}
.ok{background:var(--good-bg)}
.cls{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.chk .t{flex:1;min-width:0}
.chk.done .tt{color:var(--muted);text-decoration:line-through}
.chk input[type=text]{width:100%;margin-top:4px;font-size:13px}
.gtitle{font-size:13px;color:var(--muted);font-weight:700;margin-top:8px}
.field{display:flex;flex-direction:column;gap:3px}
.field>span:not(.whop){font-size:12px;color:var(--muted);font-weight:700}
/* 選ぶ欄と書く欄の高さをそろえる（見出しの位置がずれないように） */
.field>input:not([type=checkbox]):not([type=radio]),.field>select,.field .whop>*{height:40px}
/* 「誰が」：選ぶ欄＋「そのほか」のときだけ書く欄 */
.whop{display:flex;flex-direction:column;gap:4px;min-width:0}
.whop>*{width:100%}
.sample{background:var(--warn-bg);color:var(--warn);font-size:11px;padding:0 6px;border-radius:4px;margin-left:6px;font-weight:700;white-space:nowrap}
.gantt{min-width:780px;position:relative}
.grow{display:grid;grid-template-columns:260px 1fr;align-items:center;border-bottom:1px solid var(--line);min-height:40px}
.grow.gh{min-height:0}
/* 名前は2行まで折り返す。押すと下の表のその行へ移動する */
.glabel{font:inherit;font-size:13px;line-height:1.35;color:var(--ink);text-align:left;background:none;border:0;padding:0 10px 0 0;margin:3px 0;cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.glabel:hover{color:var(--accent-text);text-decoration:underline}
.gtrack{position:relative;height:40px;cursor:pointer}
.gv{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.gv.mon{background:var(--line)} .gv.today{background:var(--crit);width:2px;z-index:2} .gv.ev{background:var(--accent);width:2px;z-index:2}
.gb{position:absolute;top:12px;height:16px;min-width:12px;border-radius:5px;background:var(--accent);z-index:1}
.gb.done{background:var(--good)} .gb.todo{background:var(--surface);border:2px solid var(--muted)} .gb.over{background:var(--crit)}
.ghead{position:relative;height:22px;font-size:11px;color:var(--muted)}
.ghead span{position:absolute;top:2px;transform:translateX(-2px)}
/* タスク表：内容を広く・折り返して全文表示。ほかの列は幅を決めて詰める */
.tw>table.ttbl{table-layout:fixed;min-width:760px}
.ttbl td{vertical-align:middle}
.ttbl textarea.ttl{display:block;width:100%;resize:none;overflow:hidden;line-height:1.5;padding:5px 8px}
.ttbl .ttl+.chip{margin-top:4px}
.ttbl td input,.ttbl td select{min-width:0}
.ttbl .cs .bi{display:flex;width:100%}
.ttbl .cs select{flex:1;font-size:13px;padding:4px 2px 4px 6px}
.ttbl .who input,.ttbl .who select{font-size:13px;padding-inline:6px}
.ttbl .dt{display:grid;grid-template-columns:auto 1fr;gap:3px 6px;align-items:center}
.ttbl .dt span{font-size:11px;color:var(--muted);font-weight:700}
.ttbl .dt input{font-size:13px;padding:2px 4px;width:100%;min-width:0}
.ttbl .del{text-align:center;padding-inline:0}
.addt .field input{width:100%}
@media (max-width:640px){.addt>.field{flex:1 1 130px}}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;max-width:760px}
.doc h2{margin-bottom:8px} .doc h3{margin:18px 0 6px} .doc p{margin:6px 0} .doc ul{margin:6px 0;padding-left:20px}
.doc blockquote{margin:10px 0;padding:6px 14px;border-left:4px solid var(--accent);background:var(--accent-bg)}
.doc .src{font-size:12px;color:var(--muted);margin-top:16px}
.docnav{display:flex;flex-wrap:wrap;gap:8px}
.docnav .on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.lock{border:1px dashed var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13px}
.hl{animation:hl 2.4s ease-out}
@keyframes hl{0%,30%{background:var(--warn-bg)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.hl{animation:none;background:var(--warn-bg)}}
 .empty{color:var(--muted);padding:10px 0}
.ic{display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--ic) 16%,var(--surface));color:var(--ic);vertical-align:middle}
.ic.s{width:22px;height:22px}
h2 .ic,h3 .ic{margin-right:8px;width:30px;height:30px}
.bi{display:inline-flex;align-items:center;gap:6px}
.b svg,.b2 svg,.danger svg{flex:none}
.al .ai{flex:none;margin-top:3px}
.al.crit .ai{color:var(--crit)} .al.warn .ai{color:var(--warn)} .al.info .ai{color:var(--accent-text)}
.al>span:not(.ai){flex:1;min-width:0}
.danger{background:var(--crit);color:var(--crit-ink);border:1px solid var(--crit);border-radius:8px;padding:6px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.confirm{border:2px solid var(--crit);background:var(--crit-bg);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.photos{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ph{position:relative}
.place{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.place:first-of-type{border-top:0;padding-top:0}
.pwho{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pwho .chip{font-size:13px;padding:2px 4px 2px 10px}
.pwho .chip .x{padding:0 4px;font-size:12px;color:inherit}
.pwho select,.pwho input{height:32px;font-size:13px;max-width:12em}
.ph>button.t{border:1px solid var(--line);border-radius:8px;padding:0;background:var(--surface);display:block;overflow:hidden}
.ph img{display:block;width:64px;height:64px;object-fit:cover}
.ph .rm{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
label.bi:focus-within{outline:2px solid var(--accent);outline-offset:2px}
label.b2.bi{cursor:pointer}
#zoom{display:none}
#zoom.on{display:grid;place-items:center;position:fixed;inset:0;z-index:20;background:rgba(5,25,33,.84);padding:16px;cursor:pointer}
#zoom img{max-width:100%;max-height:82vh;border-radius:8px;background:#fff;display:block;margin:0 auto}
#zoom .zt{color:#fff;margin-top:10px;text-align:center;font-size:13px}

/* 当日の動き：職員×時間帯の表。持ち場の種類で色を分ける */
.dg{border-collapse:collapse;width:100%;font-size:13px;table-layout:fixed}
.tw>table.dg{min-width:640px}
.dg th,.dg td{border:1px solid var(--line);padding:5px 6px;text-align:center;vertical-align:middle;line-height:1.4;white-space:normal}
.dg thead th{background:var(--accent-bg);color:var(--ink);font-size:12px}
.dg thead th small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.dg th.nm{position:sticky;left:0;z-index:1;background:var(--surface);color:var(--ink);font-size:13px;text-align:left}
.dg thead th.nm{background:var(--accent-bg)}
.dg td .arr{color:var(--muted);margin-left:6px}
.dg td .tm{display:block;font-size:11px;color:var(--muted);font-weight:700}
.dk-cls{background:color-mix(in srgb,var(--k-b) 18%,var(--surface))}
.dk-uk{background:color-mix(in srgb,var(--c5) 18%,var(--surface))}
.dk-mi{background:color-mix(in srgb,var(--k-o) 22%,var(--surface))}
.dk-ho{background:color-mix(in srgb,var(--k-p) 18%,var(--surface))}
.dk-ba{background:color-mix(in srgb,var(--k-c) 16%,var(--surface))}
.dk-ni{background:color-mix(in srgb,var(--k-g) 18%,var(--surface))}
.dk-fr{background:color-mix(in srgb,var(--muted) 14%,var(--surface))}
.doff{background:repeating-linear-gradient(135deg,var(--surface) 0 7px,var(--line) 7px 8px)}
.dg tr.dchk td,.dg tr.dchk th{background:var(--surface);font-size:12px;text-align:left}
.dchk .ok{background:none;color:var(--good)} .dchk .ng{color:var(--crit);font-weight:700}
.dlg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.dlg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.dg.ed td{padding:3px}
.dg.ed td input{width:100%;min-width:0;font-size:13px;padding:4px 6px;background:transparent;border:1px dashed var(--line)}
.dg.ed td input:disabled{border:0}
.dg.ed th.nm input{width:100%;font-size:13px;padding:3px 6px}
.dg.ed th.nm .tms{display:grid;grid-template-columns:auto 1fr;gap:2px 4px;align-items:center;margin-top:3px;font-size:11px;font-weight:400;color:var(--muted)}
.dg.ed th.nm .tms input{font-size:12px;padding:1px 4px}
.dg.ed th.nm .rb{display:flex;gap:0;margin-top:2px}
.dg.ed th.nm .rb .x{font-size:13px;padding:0 6px}
.dneed td input[type=number]{width:64px;min-width:0}
/* プログラム（保護者に配る。部ごとにA4縦1枚）。見る画面と印刷で同じ見た目。紙の色なのでダークモードでも変えない */
.pgw{overflow-x:auto;padding:4px 0 8px}
.pg{--pi:#545454;--pm:#7a7470;--pl:#eadfd3;width:794px;height:1123px;margin:0 auto 18px;background:#FFFDF9;color:var(--pi);font-family:var(--f-head);padding:52px 64px 22px;box-shadow:0 2px 12px rgba(0,0,0,.14);position:relative;overflow:hidden;display:flex;flex-direction:column;line-height:1.5;text-align:left}
.pg>*{position:relative;z-index:1}
.pg .pg-w{position:absolute;z-index:0;border-radius:50%;filter:url(#pgwc);pointer-events:none}
.pg-w1{width:360px;height:300px;left:-120px;top:-90px;background:radial-gradient(circle at 55% 55%,#F8D3CF 0%,#FBE1D9 45%,transparent 70%);opacity:.75}
.pg-w2{width:300px;height:260px;right:-110px;top:-60px;background:radial-gradient(circle at 45% 55%,#DDEBCB 0%,#E9F2DC 45%,transparent 70%);opacity:.8}
.pg-w3{width:340px;height:300px;right:-140px;bottom:-110px;background:radial-gradient(circle at 40% 40%,#E3D7F1 0%,#EEE6F7 45%,transparent 70%);opacity:.85}
.pg-w4{width:360px;height:280px;left:-150px;bottom:-100px;background:radial-gradient(circle at 60% 40%,#FCE0BF 0%,#FDEBD5 45%,transparent 70%);opacity:.85}
.pg-w5{width:200px;height:170px;left:-110px;top:470px;background:radial-gradient(circle,#D3EBDC 0%,transparent 68%);opacity:.7}
.pg-w6{width:180px;height:160px;right:-95px;top:560px;background:radial-gradient(circle,#F8DCE5 0%,transparent 68%);opacity:.7}
.pg-en{text-align:center;font-size:16px;font-weight:700;color:var(--pm);letter-spacing:.35em;margin-bottom:6px}
.pg-meta{display:flex;justify-content:center}
.pg-d{background:radial-gradient(ellipse at 20% 40%,#FBD9C4 0%,transparent 60%),radial-gradient(ellipse at 80% 60%,#FCE6C9 0%,transparent 65%),radial-gradient(ellipse at 50% 0%,#F8E1E4 0%,transparent 70%),#FDF1E6;font-size:20px;font-weight:700;border-radius:999px;padding:6px 26px;box-shadow:inset 0 0 0 1px rgba(232,145,45,.18)}
.pg-ti{text-align:center;font-weight:900;font-size:31px;line-height:1.4;letter-spacing:.02em;margin-top:4px;white-space:pre-line}
.pg-pt{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
.pg-no{position:relative;font-weight:900;font-size:22px;padding:4px 22px;letter-spacing:.14em}
.pg-no::before{content:"";position:absolute;inset:0;border-radius:12px;background:#F3EAE0;filter:url(#pgwc2);z-index:-1}
.pg-c{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 12px 1px 4px;font-weight:700;font-size:15px;white-space:nowrap;min-height:30px}
.pg-c img{width:28px;height:28px}

function stat(e){const o={};CATS.forEach(c=>{const ts=e.tasks.filter(t=>t.cat===c),cs=e.checks.filter(k=>k.cat===c);const total=ts.length+cs.length;const done=ts.filter(t=>t.status==="完了").length+cs.filter(k=>k.done).length;o[c]={total,done,pct:total?Math.round(done/total*100):0}});return o}
const chkCount=(e,c)=>{const cs=e.checks.filter(k=>k.cat===c);return cs.filter(k=>k.done).length+" / "+cs.length};
function judge(e){const att=Object.keys(e.staff).reduce((a,k)=>a+(+e.staff[k]||0),0);const need=e.places.reduce((a,p)=>a+(+p.need||0),0);const left=att-2-need;return {att,need,left,state:left<0?"short":left===0?"tight":"ok"}}
function overdue(e){return e.tasks.filter(t=>t.status!=="完了"&&t.due&&diff(t.due,asOf())>0)}
function soon(e){return e.tasks.filter(t=>t.status!=="完了"&&t.due&&diff(asOf(),t.due)>=0&&diff(asOf(),t.due)<=7)}
function orderTotal(e){return e.orders.reduce((a,o)=>a+(+o.amount||0),0)}
function otTotal(e){return e.overtime.reduce((a,o)=>a+(+o.hours||0),0)}
function alerts(e){
  const a=[];
  if(isArchive(e)){
    if(isExpired(e))a.push({lv:"warn",text:"保管期間を過ぎています（"+ymLabel(keepUntil(evFY(e)))+"まで）。消すかどうかは園長が判断します。自動では消えません。",go:"list"});
    a.push({lv:"info",text:evFY(e)+"年度の行事です（アーカイブ）。保管は"+ymLabel(keepUntil(evFY(e)))+"までです。",go:"list"});
    return a;
  }
  overdue(e).forEach(t=>a.push({lv:"crit",text:"期限が過ぎています：「"+t.title+"」（"+fmt(t.due)+"・"+t.owner+"）",go:"tasks"}));
  soon(e).forEach(t=>a.push({lv:"warn",text:"7日以内：「"+t.title+"」（"+fmt(t.due)+"・"+t.owner+"）",go:"tasks"}));
  const j=judge(e);
  if(j.state==="short")a.push({lv:"crit",text:"2人欠けると人員が足りません（あと"+(-j.left)+"人）",go:"people"});
  if(j.state==="tight")a.push({lv:"warn",text:"2人欠けると、配置の余りがありません",go:"people"});
  if(!e.commander)a.push({lv:"warn",text:"司令塔（全体を見て連絡を受ける人）が決まっていません",go:"people"});
  dayShort(e).forEach(x=>a.push({lv:"warn",text:"当日の動き：「"+x.slot+"」の"+x.name+"が足りません（"+x.have+"/"+x.need+"人）",go:"day"}));
  if(e.photographer==="unset")a.push({lv:"warn",text:"カメラマンが来るかどうかが未確認です",go:"people"});
  if(e.budget>0&&orderTotal(e)>e.budget)a.push({lv:"crit",text:"発注の合計が予算を超えています",go:"money"});
  const st=diff(e.updatedAt,asOf());
  if(st>7)a.push({lv:"warn",text:"最終更新から"+st+"日たっています。止まっていませんか？",go:"dash"});
  if(e.prevTaskCount&&e.tasks.length>Math.ceil(e.prevTaskCount*1.2))a.push({lv:"warn",text:"タスクが前回（"+e.prevTaskCount+"件）より多くなっています（"+e.tasks.length+"件）。やりたいことが増えすぎていませんか？",go:"tasks"});
  const d=diff(asOf(),e.date||asOf());
  if(e.date&&d<0)a.push({lv:"info",text:"本番は終了しました。振り返りを記録しましょう",go:"log"});
  return a;
}

}

function ganttHTML(e,rows){const a=asOf();let h="";
  const ds=rows.filter(x=>x.t.due);
  if(ds.length){
    let mn=ds.reduce((m,x)=>{const s=x.t.start||x.t.due;return s<m?s:m},ds[0].t.start||ds[0].t.due);
    let mx=ds.reduce((m,x)=>x.t.due>m?x.t.due:m,ds[0].t.due);
    /* 本番の日も期間に入れる（タスクが本番より前に終わっても、本番の縦線が出るように） */
    if(e.date){if(e.date<mn)mn=e.date;if(e.date>mx)mx=e.date}
    const span=diff(mn,mx)+1;const pos=s=>diff(mn,s)/span*100;
    const lines=[];for(let k=0;k<span;k++){const d=addDays(D(mn),k);if(d.getDay()===1)lines.push({k,lab:(d.getMonth()+1)+"/"+d.getDate()})}
    const vl=lines.map(l=>'<i class="gv mon" style="left:'+(l.k/span*100)+'%"></i>').join("")+(diff(mn,a)>=0&&diff(a,mx)>=0?'<i class="gv today" style="left:'+pos(a)+'%"></i>':"")+(e.date&&diff(mn,e.date)>=0&&diff(e.date,mx)>=0?'<i class="gv ev" style="left:'+pos(e.date)+'%"></i>':"");
    h+='<div class="tw card"><div class="gantt"><div class="grow gh"><div></div><div class="ghead">'+lines.map(l=>'<span style="left:'+(l.k/span*100)+'%">'+l.lab+'</span>').join("")+'</div></div>'+
      ds.map(x=>{const t=x.t,s=t.start||t.due;const w=Math.max(1.4,(diff(s,t.due)+1)/span*100);const cls=t.status==="完了"?"done":diff(t.due,a)>0?"over":t.status==="進行中"?"":"todo";
        return '<div class="grow"><button type="button" class="glabel" data-act="jump" data-i="'+x.i+'" data-gl="'+x.i+'" title="'+esc(t.title)+'">'+esc(t.title)+'</button><div class="gtrack" data-act="jump" data-i="'+x.i+'" title="'+esc(t.title)+'（'+short(s)+'〜'+short(t.due)+'）">'+vl+'<i class="gb '+cls+'" style="left:'+pos(s)+'%;width:'+w+'%"></i></div></div>'}).join("")+
      '</div><p class="small muted" style="margin:8px 0 0">赤い縦線＝この日（'+fmt(a)+'）／青緑の縦線＝本番。緑＝完了、青緑＝進行中、枠だけ＝未着手、赤＝期限切れ。名前やバーを押すと、下の表のその行へ移動します。</p></div>';
  }
  return h}

/* ===== 当日の動き（だれが・いつ・どこで）：職員×時間帯の表 =====
   マスには持ち場の名前を書く（例：門前見張り、園庭）。書いてある持ち場の名前で色を決め、抜けチェックで数える。
   「→」だけのマスは左と同じ。出勤・退勤の時刻を入れると、まったく重ならない時間帯は勤務外（斜線）になる */
const DAYK={cls:"クラス",uk:"受付・係",mi:"見張り",ho:"保育",ba:"園庭・ホール",ni:"日誌",fr:"フリー"};
const DAYPOSTS=[["クラス","cls"],["受付","uk"],["係","uk"],["門前","mi"],["駐車場","mi"],["保育","ho"],["園庭","ba"],["ホール","ba"],["日誌","ni"],["フリー","fr"]];
const CONT="→";
function dayInit(e){
  if(!e.day)e.day={slots:[],posts:DAYPOSTS.map(p=>({name:p[0],kind:p[1],need:{}})),rows:[]};
  const d=e.day;d.slots=d.slots||[];d.posts=d.posts||[];d.rows=d.rows||[];
  d.posts.forEach(p=>{if(!p.need)p.need={}});d.rows.forEach(r=>{if(!r.cells)r.cells={}});d.slots.forEach(s=>{if(!s.cls)s.cls=[]});
  const dr=S.ui.draft;if(!dr.slot)dr.slot={name:"",from:"",to:""};if(dr.drow==null)dr.drow="";if(!dr.dpost)dr.dpost={name:"",kind:"ba"};
  return d;
}
const tmin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(String(t||""));return m?Number(m[1])*60+Number(m[2]):null};
const tlab=t=>{const m=tmin(t);return m==null?"":Math.floor(m/60)+":"+String(m%60).padStart(2,"0")};
const cshort=c=>String(c).replace(/組$/,"");
/* 時間帯の始まり・終わり（書いていなければ、前の終わり／次の始まりを使う） */
function dayBounds(d){return d.slots.map((s,k)=>{
  let f=tmin(s.from),t=tmin(s.to);
  if(f==null&&k>0){const p=d.slots[k-1];f=tmin(p.to);if(f==null)f=tmin(p.from)}
  if(t==null&&k<d.slots.length-1){const n=d.slots[k+1];t=tmin(n.from);if(t==null)t=tmin(n.to)}
  return {f:f==null?-Infinity:f,t:t==null?Infinity:t}})}
/* 職員1人の、時間帯ごとの勤務（on）と「〇:〇〇出勤／退勤」の表示 */
function dayDuty(r,b){
  const i=tmin(r.in),o=tmin(r.out),I0=i==null?-Infinity:i,O0=o==null?Infinity:o;
  const on=b.map(x=>{if(i==null&&o==null)return true;const ov=Math.min(x.t,O0)-Math.max(x.f,I0);return ov>0});
  const lab=b.map(()=>"");const f=on.indexOf(true),l=on.lastIndexOf(true);
  if(f>=0&&i!=null&&i>b[f].f)lab[f]=tlab(r.in)+"出勤";
  if(l>=0&&o!=null&&o<b[l].t)lab[l]=(lab[l]?lab[l]+"・":"")+tlab(r.out)+"退勤";
  return {on,lab};
}
/* マスの中身（「→」なら左をさかのぼる） */
function dayEff(d,r,k){for(let j=k;j>=0;j--){const t=String(r.cells[d.slots[j].id]||"").trim();if(t!==CONT)return t}return ""}
/* 書いてある持ち場のうち、一番前にあるものの種類で色を決める */
function dayKind(d,t){let best=null,bi=1e9,bl=0;d.posts.forEach(p=>{const n=String(p.name||"").trim();if(!n)return;const x=t.indexOf(n);if(x>=0&&(x<bi||(x===bi&&n.length>bl))){best=p;bi=x;bl=n.length}});return best?best.kind:""}
/* 抜けチェック：時間帯ごとに、必要な人数を入れた持ち場だけ数える */
function dayCheck(e){
  const d=e.day;if(!d||!d.slots.length)return [];const b=dayBounds(d);const du=d.rows.map(r=>dayDuty(r,b));
  return d.slots.map((s,k)=>({s,k,items:d.posts.filter(p=>String(p.name||"").trim()&&(+p.need[s.id]||0)>0).map(p=>{const n=p.name.trim();const who=d.rows.filter((r,ri)=>du[ri].on[k]&&dayEff(d,r,k).indexOf(n)>=0).map(r=>r.name||"（名前なし）");return {name:n,need:+p.need[s.id],have:who.length,who}})}));
}
const dayShort=e=>dayCheck(e).reduce((a,x)=>a.concat(x.items.filter(i=>i.have<i.need).map(i=>({slot:x.s.name||"（名前なし）",name:i.name,have:i.have,need:i.need}))),[]);
const slotHead=s=>esc(s.name||"（名前なし）")+'<small>'+((s.from||s.to)?esc(tlab(s.from))+"〜"+esc(tlab(s.to)):"")+(s.cls&&s.cls.length?(s.from||s.to?"<br>":"")+esc(s.cls.map(cshort).join("・")):"")+'</small>';
const dayLegend=()=>'<div class="dlg">'+Object.keys(DAYK).map(k=>'<span><i class="dk-'+k+'"></i>'+DAYK[k]+'</span>').join("")+'<span><i class="doff"></i>勤務外</span></div>';
function dayChkRow(e,cols){
  const ck=dayCheck(e);if(!ck.some(x=>x.items.length))return "";
  return '<tr class="dchk"><th class="nm">抜けチェック</th>'+ck.map(x=>'<td>'+(x.items.length?x.items.map(i=>'<div class="'+(i.have<i.need?"ng":"ok")+'">'+esc(i.name)+' '+i.have+'/'+i.need+(i.have<i.need?"　足りない":"")+'</div>').join(""):'<span class="muted">—</span>')+'</td>').join("")+(cols||"")+'</tr>';
}
/* 見る用・印刷用の表（「→」は左とつなげる） */
function dayGridHTML(e){
  const d=e.day,b=dayBounds(d);
  let h='<table class="dg" style="min-width:'+(6.5+d.slots.length*8)+'em"><colgroup><col style="width:6.5em">'+d.slots.map(()=>'<col>').join("")+'</colgroup><thead><tr><th class="nm"></th>'+d.slots.map(s=>'<th>'+slotHead(s)+'</th>').join("")+'</tr></thead><tbody>';
  d.rows.forEach(r=>{
    const du=dayDuty(r,b);h+='<tr><th class="nm">'+esc(r.name||"（名前なし）")+'</th>';
    let k=0;
    while(k<d.slots.length){
      if(!du.on[k]){h+='<td class="doff"></td>';k++;continue}
      const t=dayEff(d,r,k);let span=1;
      while(k+span<d.slots.length&&du.on[k+span]&&String(r.cells[d.slots[k+span].id]||"").trim()===CONT)span++;
      const kd=t?dayKind(d,t):"";const lab=du.lab.slice(k,k+span).filter(Boolean).join("・");
      h+='<td'+(span>1?' colspan="'+span+'"':"")+(kd?' class="dk-'+kd+'"':"")+'>'+(lab?'<span class="tm">'+esc(lab)+'</span>':"")+esc(t)+(span>1?'<span class="arr">'+CONT+'</span>':"")+'</td>';
      k+=span;
    }
    h+='</tr>';
  });
  return h+dayChkRow(e)+'</tbody></table>';
}
/* 入力用の表 */
function dayEditHTML(e){
  const d=e.day,last=d.rows.length-1;
  let h='<table class="dg ed" style="min-width:'+(10.5+d.slots.length*9)+'em"><colgroup><col style="width:10.5em">'+d.slots.map(()=>'<col style="min-width:9em">').join("")+'</colgroup><thead><tr><th class="nm">名前・勤務</th>'+d.slots.map((s,k)=>'<th data-dh="'+k+'">'+slotHead(s)+'</th>').join("")+'</tr></thead><tbody>';
  d.rows.forEach((r,ri)=>{
    h+='<tr><th class="nm"><input data-p="day.rows.'+ri+'.name" value="'+esc(r.name)+'" aria-label="名前" placeholder="名前"><div class="tms"><span>出勤</span><input type="time" data-p="day.rows.'+ri+'.in" value="'+esc(r.in||"")+'" aria-label="'+esc(r.name)+'の出勤"><span>退勤</span><input type="time" data-p="day.rows.'+ri+'.out" value="'+esc(r.out||"")+'" aria-label="'+esc(r.name)+'の退勤"></div><div class="rb"><button class="x" data-act="dayUp" data-i="'+ri+'"'+(ri?"":" disabled")+' aria-label="上へ">↑</button><button class="x" data-act="dayDown" data-i="'+ri+'"'+(ri<last?"":" disabled")+' aria-label="下へ">↓</button><button class="x" data-act="dayAskDel" data-k="rows" data-i="'+ri+'" aria-label="'+esc(r.name)+'の行を消す">'+svg("trash",14)+'</button></div></th>'+
      d.slots.map((s,k)=>'<td data-dc="'+ri+':'+k+'"><span class="tm"></span><input data-p="day.rows.'+ri+'.cells.'+s.id+'" value="'+esc(r.cells[s.id]||"")+'" list="dayposts" aria-label="'+esc(r.name)+'・'+esc(s.name)+'"></td>').join("")+'</tr>';
  });
  return h+dayChkRow(e)+'</tbody></table>';
}
function dayDelConfirm(e){
  const x=S.ui.dayDel;if(!x)return "";const d=e.day,it=d[x.k]&&d[x.k][x.i];if(!it){S.ui.dayDel=null;return ""}
  const nm=x.k==="rows"?"「"+(it.name||"名前なし")+"」の行":"時間帯「"+(it.name||"名前なし")+"」";
  return '<div class="confirm" role="alertdialog" aria-label="削除の確認"><b>'+esc(nm)+'を消しますか？</b><span class="small">'+(x.k==="rows"?"この人のマスの中身も消えます。":"この時間帯の列のマスの中身も消えます。")+'元に戻せません。</span><div class="row"><button class="danger" data-act="dayDoDel">'+svg("trash",16)+'消す</button><button class="b2" data-act="dayNoDel">やめる</button></div></div>';
}
function vDay(){
  const e=ev(),d=dayInit(e);
  if(S.ui.dayEdit==null)S.ui.dayEdit=!d.rows.length||!d.slots.length;
  const edit=S.ui.dayEdit;
  let h='<div class="sec"><h2>'+IC("clock","--k-o")+'当日の動き（だれが・いつ・どこで）</h2>';
  h+='<p class="small muted" style="margin:0">本番の日に、だれがどの時間にどこで動くかを1枚で見る表です。マスに持ち場の名前（受付・門前・園庭 など）を書くと色がつき、下の「抜けチェック」で人数を数えます。「→」だけのマスは左と同じです。</p>';
  h+='<div class="row"><button class="'+(edit?"b2":"b")+'" data-act="dayMode" data-i="0" aria-pressed="'+(!edit)+'">全体を見る</button><button class="'+(edit?"b":"b2")+'" data-act="dayMode" data-i="1" aria-pressed="'+edit+'">入力する</button><button class="b2 bi" data-act="dayPrint">'+svg("print",16)+'当日の動きを印刷（A4横）</button></div>';
  h+='<div id="dayal"></div>'+dayDelConfirm(e);
  if(!edit){
    if(!d.slots.length||!d.rows.length)h+='<p class="empty">まだ表がありません。「入力する」から、時間帯と職員を足してください。</p>';
    else h+=dayLegend()+'<div class="tw card">'+dayGridHTML(e)+'</div>';
    return h+'</div>';
  }
  /* 1. 時間帯 */
  h+='</div><div class="sec"><h2>'+IC("clock","--k-o")+'1. 時間帯（表の列）</h2><div class="tw card"><table><thead><tr><th>名前</th><th>始まり</th><th>終わり</th><th>対象クラス</th><th></th></tr></thead><tbody>'+
    (d.slots.length?d.slots.map((s,k)=>'<tr><td><input data-p="day.slots.'+k+'.name" value="'+esc(s.name)+'" aria-label="時間帯の名前"></td><td><input type="time" data-p="day.slots.'+k+'.from" value="'+esc(s.from||"")+'" aria-label="始まり"></td><td><input type="time" data-p="day.slots.'+k+'.to" value="'+esc(s.to||"")+'" aria-label="終わり"></td><td><div class="row" style="gap:2px 10px">'+CLASSES.map(c=>'<label class="row" style="gap:3px;font-size:13px;white-space:nowrap"><input type="checkbox" data-act="dayCls" data-i="'+k+'" data-c="'+esc(c[0])+'"'+(s.cls.indexOf(c[0])>=0?" checked":"")+'>'+esc(cshort(c[0]))+'</label>').join("")+'</div></td><td><button class="x" data-act="dayAskDel" data-k="slots" data-i="'+k+'" aria-label="この時間帯を消す">'+svg("trash",16)+'</button></td></tr>').join(""):'<tr><td colspan="5" class="empty">まだありません。下から足してください（例：1部・2部・3部・片付け）。</td></tr>')+
    '</tbody></table><div class="row frow" style="margin-top:10px">'+field("名前",DR("slot.name",{ph:"例：1部"}))+field("始まり",DR("slot.from",{t:"time"}))+field("終わり",DR("slot.to",{t:"time"}))+'<button class="b2 bi" data-act="daySlot">'+svg("plus",16)+'時間帯を足す</button></div><p class="small muted" style="margin:6px 0 0">「片付け」のように時刻がない時間帯は、空のままで大丈夫です（前の時間帯の終わりから続くものとして扱います）。</p></div></div>';
  /* 2. 表 */
  h+='<div class="sec"><h2>'+IC("people","--k-o")+'2. 職員ごとの動き</h2>';
  if(!d.slots.length)h+='<p class="empty">先に時間帯を足すと、ここに表が出ます。</p>';
  else h+=dayLegend()+'<div class="tw card">'+dayEditHTML(e)+'</div><p class="small muted" style="margin:0">マスを押すと持ち場の候補が出ます（候補にない言葉もそのまま書けます。例：「10:45〜門前見張り、園庭」）。出勤・退勤の時刻を入れると、その時間に重ならないマスは斜線になります。</p>';
  const missing=STAFF.filter(n=>!d.rows.some(r=>r.name===n));
  h+='<div class="row frow">'+field("名前を足す",'<input data-u="draft.drow" value="'+esc(S.ui.draft.drow)+'" list="daystaff" placeholder="職員の名前">')+'<button class="b2 bi" data-act="dayRow">'+svg("plus",16)+'行を足す</button>'+(missing.length?'<button class="b2 bi" data-act="dayStaff">'+svg("people",16)+'職員名をまとめて並べる（'+missing.length+'人）</button>':"")+'</div></div>';
  /* 3. 抜けチェック */
  h+='<div class="sec"><h2>'+IC("alert","--k-o")+'3. 抜けチェック（持ち場ごとに必要な人数）</h2><p class="small muted" style="margin:0">必要な人数を入れた持ち場だけ数えます。マスにその名前が書いてあれば1人と数えます（例：「受付応援」は「受付」に、「門前見張り」は「門前」に入ります）。持ち場の種類は表の色に使います。</p><div class="tw card"><table class="dneed"><thead><tr><th>持ち場</th><th>種類（色）</th>'+d.slots.map(s=>'<th>'+esc(s.name||"（名前なし）")+'</th>').join("")+'<th></th></tr></thead><tbody>'+
    d.posts.map((p,i)=>'<tr><td><input data-p="day.posts.'+i+'.name" value="'+esc(p.name)+'" aria-label="持ち場の名前"></td><td><select data-p="day.posts.'+i+'.kind" aria-label="種類">'+Object.keys(DAYK).map(k=>'<option value="'+k+'"'+(p.kind===k?" selected":"")+'>'+DAYK[k]+'</option>').join("")+'</select></td>'+d.slots.map(s=>'<td><input type="number" min="0" data-p="day.posts.'+i+'.need.'+s.id+'" value="'+((+p.need[s.id]||0)||"")+'" placeholder="—" aria-label="'+esc(p.name)+'・'+esc(s.name)+'の必要人数"></td>').join("")+'<td><button class="x" data-act="dayPostDel" data-i="'+i+'" aria-label="この持ち場を消す">'+svg("trash",16)+'</button></td></tr>').join("")+
    '</tbody></table><div class="row frow" style="margin-top:10px">'+field("持ち場を足す",DR("dpost.name",{ph:"例：プール"}))+field("種類（色）",DS("dpost.kind",Object.keys(DAYK).map(k=>[k,DAYK[k]])))+'<button class="b2 bi" data-act="dayPost">'+svg("plus",16)+'足す</button></div></div></div>';
  h+='<datalist id="dayposts">'+d.posts.filter(p=>String(p.name||"").trim()).map(p=>'<option value="'+esc(p.name)+'"></option>').join("")+['門前見張り','駐車場見張り'].map(n=>'<option value="'+n+'"></option>').join("")+CLASSES.map(c=>'<option value="'+esc(cshort(c[0]))+'クラス"></option>').join("")+'<option value="'+CONT+'">左と同じ</option></datalist>';
  h+='<datalist id="daystaff">'+missing.map(n=>'<option value="'+esc(n)+'"></option>').join("")+'</datalist>';
  return h;
}
/* 入力中に描き直さずに、色・斜線・出勤退勤・抜けチェックだけ更新する */
function dayDerived(){
  const al=$c("dayal");if(!al)return;const e=ev();if(!e||!e.day)return;const d=e.day;
  const sh=dayShort(e);
  al.innerHTML=sh.length?'<ul class="plain">'+sh.map(x=>'<li class="al crit"><span class="ai">'+svg("alert",18)+'</span><span>「'+esc(x.slot)+'」の'+esc(x.name)+'が足りません（'+x.have+'/'+x.need+'人）</span></li>').join("")+'</ul>':"";
  const b=dayBounds(d);
  d.slots.forEach((s,k)=>{const th=document.querySelector('[data-dh="'+k+'"]');if(th)th.innerHTML=slotHead(s)});
  d.rows.forEach((r,ri)=>{const du=dayDuty(r,b);d.slots.forEach((s,k)=>{
    const td=document.querySelector('[data-dc="'+ri+':'+k+'"]');if(!td)return;
    const inp=td.querySelector("input"),tm=td.querySelector(".tm");
    if(!du.on[k]){td.className="doff";if(inp)inp.disabled=true;if(tm)tm.textContent="勤務外";return}
    if(inp)inp.disabled=false;const t=dayEff(d,r,k),kd=t?dayKind(d,t):"";td.className=kd?"dk-"+kd:"";
    if(tm)tm.textContent=du.lab[k]||""})});
  const tb=document.querySelector(".dg.ed tbody");
  if(tb){const old=tb.querySelector("tr.dchk");if(old)old.remove();const html=dayChkRow(e);if(html)tb.insertAdjacentHTML("beforeend",html)}
}

/* 終わりの時刻が、始まりより後になっていない部（「10:00〜9:00」のような入れ間違い） */
const pgTimeBad=pt=>{const a=tmin(pt.from),b=tmin(pt.to);return a!=null&&b!=null&&b<=a};
const PG_TIME_MSG='<span class="chip warn">終わりの時刻が、始まりより後になっていません。</span>';
/* 1枚に収まっていない部を数える（pages は .pg の並び）。下に切れる・横に切れるを分けて返す。飾りのにじみ（はみ出してよい）は数えない */
function pgOver(pages){
  return Array.from(pages).map((p,k)=>{
    const cs=Array.from(p.children).filter(c=>!c.classList.contains("pg-w")),l=cs[cs.length-1];
    const down=!!l&&l.getBoundingClientRect().bottom>p.getBoundingClientRect().bottom-2,side=cs.some(c=>c.scrollWidth>c.clientWidth+8);
    return down||side?{k:k,down:down,side:side}:null}).filter(Boolean);
}
/* 印刷する前に直したほうがよい所を、文にして返す（時刻の入れ間違い・1枚に収まらない部） */
function progProblems(e,over){
  const out=[];if(!e.prog)return out;
  e.prog.parts.forEach((pt,k)=>{
    const nm="「"+esc(pt.name||"名前なし")+"」",o=over.find(x=>x.k===k);
    if(pgTimeBad(pt))out.push(nm+"の終わりの時刻（"+esc(tlab(pt.to))+"）が、始まり（"+esc(tlab(pt.from))+"）より後になっていません。時刻を直してください。");
    if(o&&o.down)out.push(nm+"が1枚に収まっていません。下が切れて印刷されます。演目や育ちの文を短くしてください。");
    if(o&&o.side)out.push(nm+"に、横にはみ出している行があります。右が切れて印刷されます。長い言葉を短くしてください。")});
  return out;
}

  const msg=bad?'<span style="color:var(--crit)"><b>'+esc(SAVE.m)+'</b></span>':'<span>'+(k==="saving"?"Googleシートに保存しています…":k==="saved"?"Googleシートに保存しました（"+SAVE.at+"）":"入力はGoogleシートに保存されます。")+'</span>';

};

/* 合言葉を入れる画面（シート保存のときだけ出る）。合言葉はこの端末に覚えておく */
function passView(why){
  $c("view").innerHTML='<div class="sec"><h2>'+IC("list")+'合言葉を入れてください</h2><form id="passf" class="card stack"><p>合言葉を入れると、行事のデータが開きます。</p>'+(why?'<p style="color:var(--crit)"><b>'+esc(why)+'</b></p>':"")+'<label>合言葉 <input type="password" id="passin" autocomplete="current-password" required></label><div><button class="b" type="submit">開く</button></div><p class="small muted">この端末に覚えておきます。共用の端末では、使い終わったら画面上部の「この端末の合言葉を消す」を押してください。</p></form></div>';
  const f=$c("passin");if(f)f.focus();
}
document.addEventListener("submit",function(x){if(x.target.id!=="passf")return;x.preventDefault();Store.setPass($c("passin").value);$c("view").innerHTML='<p class="empty">開いています…</p>';boot()});
boot();
})();
</script>
</body>
</html>
